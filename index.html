<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMR AutoGrader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script async src="https://docs.opencv.org/4.7.0/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
  
  <style>
    body {
      background: radial-gradient(circle at 15% 15%, rgba(147, 51, 234, 0.15), transparent 40%),
                  radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.15), transparent 40%),
                  #0f172a;
      background-attachment: fixed;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .aurora-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .aurora-btn {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      transition: all 0.3s ease;
    }
    .aurora-btn:hover {
      opacity: 0.9;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
    }
    .key-bubble.selected {
      background-color: #6366f1;
      border-color: #a855f7;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
      transform: scale(1.05);
    }
  </style>
</head>
<body class="min-h-screen pb-12 text-slate-100">

  <header class="aurora-card sticky top-0 z-40 border-b border-slate-700/50 mb-6 px-4 sm:px-6 py-4">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-3 w-full sm:w-auto justify-between sm:justify-start">
        <div class="flex items-center space-x-3">
          <div class="p-2 bg-indigo-600/30 rounded-lg border border-indigo-400/30">
            <i class="fa-solid fa-microchip text-indigo-400 text-xl"></i>
          </div>
          <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400">
            Precision OMR Engine
          </h1>
        </div>
        <span id="cv-status" class="text-xs px-2 py-1 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">
          Loading OpenCV...
        </span>
      </div>
      
      <div class="grid grid-cols-3 gap-2 w-full sm:w-auto text-center">
        <button onclick="switchTab('generator')" id="tab-generator" class="px-3 py-2 rounded-lg text-xs sm:text-sm font-medium aurora-btn text-white">Generator</button>
        <button onclick="switchTab('scanner')" id="tab-scanner" class="px-3 py-2 rounded-lg text-xs sm:text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">Scanner</button>
        <button onclick="switchTab('records')" id="tab-records" class="px-3 py-2 rounded-lg text-xs sm:text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">Records (<span id="record-count">0</span>)</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4">

    <section id="sec-generator" class="space-y-6">
      <div class="aurora-card p-4 sm:p-6 rounded-2xl">
        <h2 class="text-lg font-semibold mb-4 text-indigo-300"><i class="fa-solid fa-sliders mr-2"></i>Sheet Layout Setup</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Number of Test Items</label>
            <input type="number" id="gen-item-count" min="5" max="100" value="20" class="w-full bg-slate-900/60 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Choices per Item</label>
            <select id="gen-choices-count" class="w-full bg-slate-900/60 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
              <option value="4">4 Choices (A, B, C, D)</option>
              <option value="5">5 Choices (A, B, C, D, E)</option>
            </select>
          </div>
          <div class="sm:col-span-2 lg:col-span-1 flex items-end">
            <button onclick="generatePDFSheet()" class="w-full aurora-btn py-2.5 rounded-lg text-sm font-semibold text-white flex items-center justify-center">
              <i class="fa-solid fa-file-arrow-down mr-2"></i>Download High-Precision PDF
            </button>
          </div>
        </div>
      </div>
    </section>

    <section id="sec-scanner" class="hidden space-y-6">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div class="lg:col-span-5 aurora-card p-4 sm:p-6 rounded-2xl space-y-5">
          <div>
            <h2 class="text-lg font-semibold text-indigo-300 mb-4"><i class="fa-solid fa-key mr-2"></i>Answer Key Setup</h2>
            <div class="mb-4">
              <label class="block text-xs font-medium text-slate-400 mb-1">Class Section Target</label>
              <input type="text" id="scan-section" placeholder="e.g. Math-101" class="w-full bg-slate-900/60 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div id="key-container" class="max-h-80 overflow-y-auto space-y-2 pr-1 border border-slate-800 p-3 rounded-xl bg-slate-950/60"></div>
          </div>
        </div>

        <div class="lg:col-span-7 aurora-card p-6 rounded-2xl flex flex-col items-center justify-center text-center">
          <i class="fa-solid fa-camera-viewfinder text-5xl text-indigo-400 mb-4"></i>
          <h2 class="text-xl font-bold text-slate-100 mb-2">Optical Scanning Terminal</h2>
          <p class="text-xs text-slate-400 max-w-md mb-6">Ensure the 4 registration markers on the sheet are fully visible within the camera viewport.</p>
          <button onclick="openCameraModal()" class="w-full max-w-sm aurora-btn py-3 rounded-xl font-bold text-white shadow-lg flex items-center justify-center text-sm">
            <i class="fa-solid fa-expand mr-2"></i>Open Scanner Viewport
          </button>
        </div>
      </div>
    </section>

    <section id="sec-records" class="hidden space-y-6">
      <div class="aurora-card p-4 sm:p-6 rounded-2xl">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-lg font-semibold text-indigo-300"><i class="fa-solid fa-table-list mr-2"></i>Scanned Results</h2>
          <button onclick="syncToGoogleSheets()" class="aurora-btn px-4 py-2 rounded-lg text-sm font-semibold text-white">
            <i class="fa-solid fa-cloud-arrow-up mr-2"></i>Sync to Google Sheets
          </button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs sm:text-sm text-slate-300">
            <thead class="bg-slate-900/80 text-xs uppercase text-slate-400 border-b border-slate-700">
              <tr>
                <th class="p-3">Time</th>
                <th class="p-3">Student Name</th>
                <th class="p-3">Section</th>
                <th class="p-3">Score</th>
                <th class="p-3">Percentage</th>
                <th class="p-3 text-right">Action</th>
              </tr>
            </thead>
            <tbody id="records-table-body" class="divide-y divide-slate-800"></tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <div id="camera-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4">
    <div class="aurora-card w-full max-w-xl rounded-2xl overflow-hidden flex flex-col">
      <div class="p-4 border-b border-slate-700/60 flex justify-between items-center bg-slate-900/50">
        <h3 class="font-semibold text-indigo-200 text-sm">Align Sheet Within Viewport</h3>
        <button onclick="closeCameraModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="p-4 flex flex-col items-center">
        <div class="relative w-full aspect-[3/4] max-h-[60vh] bg-slate-950 rounded-xl overflow-hidden border border-slate-700/80">
          <video id="webcam" class="hidden" playsinline></video>
          <canvas id="scan-canvas" class="w-full h-full object-cover"></canvas>
        </div>
        <button id="scan-btn" onclick="captureAndGrade()" class="mt-4 w-full aurora-btn py-3 rounded-xl font-bold text-white shadow-lg">
          <i class="fa-solid fa-bolt mr-2"></i>Capture & Grade Immediately
        </button>
      </div>
    </div>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxnHWidcXhKLdP4N2PM15bVfrxKi_LDgc6D7iQ7y7ez4-l5FCg-yaXMcUWiwoSMWR8/exec";

    let records = [];
    let answerKey = {};
    let isCameraActive = false;
    let videoStream = null;
    let isOpenCvLoaded = false;

    function onOpenCvReady() {
      isOpenCvLoaded = true;
      const statusEl = document.getElementById('cv-status');
      statusEl.innerText = "CV Engine Ready";
      statusEl.className = "text-xs px-2 py-1 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
    }

    function switchTab(tab) {
      ['generator', 'scanner', 'records'].forEach(t => {
        document.getElementById(`sec-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = "px-3 py-2 rounded-lg text-xs sm:text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700";
      });
      document.getElementById(`sec-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = "px-3 py-2 rounded-lg text-xs sm:text-sm font-medium aurora-btn text-white";
    }

    function buildKeyInputs() {
      const count = parseInt(document.getElementById('gen-item-count').value) || 20;
      const choicesCount = parseInt(document.getElementById('gen-choices-count').value) || 4;
      const choices = ['A', 'B', 'C', 'D', 'E'].slice(0, choicesCount);
      const container = document.getElementById('key-container');
      
      container.innerHTML = '';
      answerKey = {};

      for (let i = 1; i <= count; i++) {
        answerKey[i] = 'A';
        let bubblesHTML = choices.map(c => `
          <button type="button" onclick="selectKeyOption(${i}, '${c}', this)" 
            class="key-bubble key-btn-${i} w-7 h-7 rounded-full border border-slate-600 text-xs font-semibold text-slate-300 hover:border-indigo-400 ${c === 'A' ? 'selected' : ''}">
            ${c}
          </button>
        `).join('');

        container.innerHTML += `
          <div class="flex items-center justify-between py-1 px-2 rounded bg-slate-900/40 border border-slate-800">
            <span class="text-xs font-medium text-indigo-200">Q${i}</span>
            <div class="flex space-x-1">${bubblesHTML}</div>
          </div>
        `;
      }
    }

    function selectKeyOption(item, choice, el) {
      answerKey[item] = choice;
      document.querySelectorAll(`.key-btn-${item}`).forEach(b => b.classList.remove('selected'));
      el.classList.add('selected');
    }

    document.getElementById('gen-item-count').addEventListener('change', buildKeyInputs);
    document.getElementById('gen-choices-count').addEventListener('change', buildKeyInputs);
    window.addEventListener('DOMContentLoaded', buildKeyInputs);

    function generatePDFSheet() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      const itemCount = parseInt(document.getElementById('gen-item-count').value) || 20;
      const choicesCount = parseInt(document.getElementById('gen-choices-count').value) || 4;
      const labels = ['A', 'B', 'C', 'D', 'E'].slice(0, choicesCount);

      // 4 Registration Alignment Markers
      doc.setFillColor(0, 0, 0);
      doc.rect(10, 10, 12, 12, 'F');
      doc.rect(188, 10, 12, 12, 'F');
      doc.rect(10, 275, 12, 12, 'F');
      doc.rect(188, 275, 12, 12, 'F');

      doc.setFont('Helvetica', 'bold');
      doc.setFontSize(16);
      doc.text('OMR ANSWER SHEET', 105, 18, { align: 'center' });

      doc.setDrawColor(0, 0, 0);
      doc.setLineWidth(0.4);
      doc.rect(25, 26, 160, 18);
      doc.setFontSize(9);
      doc.setFont('Helvetica', 'normal');
      doc.text('Student Name: _________________________________', 28, 33);
      doc.text('Section: __________________', 28, 39);
      doc.text('Date: ____________', 130, 39);

      let startX = 30;
      let startY = 56;
      let yOffset = 0;
      let colOffset = 0;

      for (let i = 1; i <= itemCount; i++) {
        let currentY = startY + yOffset;
        let currentX = startX + colOffset;

        doc.text(`${i}.`, currentX, currentY);

        labels.forEach((label, idx) => {
          let bubbleX = currentX + 8 + (idx * 8.5);
          doc.circle(bubbleX, currentY - 1.2, 2.6, 'S');
          doc.setFontSize(6.5);
          doc.text(label, bubbleX - 0.7, currentY - 0.3);
          doc.setFontSize(9);
        });

        yOffset += 8.5;
        if (i % 20 === 0) {
          colOffset += 75;
          yOffset = 0;
        }
      }

      doc.save(`OMR_Sheet_${itemCount}_Items.pdf`);
    }

    async function openCameraModal() {
      document.getElementById('camera-modal').classList.remove('hidden');
      await startCamera();
    }

    function closeCameraModal() {
      stopCamera();
      document.getElementById('camera-modal').classList.add('hidden');
    }

    async function startCamera() {
      const video = document.getElementById('webcam');
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = videoStream;
        video.play();
        isCameraActive = true;
        renderCameraToCanvas();
      } catch (err) {
        alert('Camera access denied: ' + err.message);
        closeCameraModal();
      }
    }

    function stopCamera() {
      if (videoStream) videoStream.getTracks().forEach(t => t.stop());
      isCameraActive = false;
    }

    function renderCameraToCanvas() {
      if (!isCameraActive) return;
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('scan-canvas');
      const ctx = canvas.getContext('2d');

      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      requestAnimationFrame(renderCameraToCanvas);
    }

    // RELATIVE SHADING CHECK OMR ENGINE
    function runOMREngine(canvasId, totalItems, choicesCount) {
      let src = cv.imread(canvasId);
      let gray = new cv.Mat();
      let blur = new cv.Mat();
      let thresh = new cv.Mat();

      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
      cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0);
      cv.adaptiveThreshold(blur, thresh, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 19, 9);

      let contours = new cv.MatVector();
      let hierarchy = new cv.Mat();
      cv.findContours(thresh, contours, hierarchy, cv.RETR_TREE, cv.CHAIN_APPROX_SIMPLE);

      let cornerCandidates = [];
      let totalArea = thresh.cols * thresh.rows;

      for (let i = 0; i < contours.size(); ++i) {
        let cnt = contours.get(i);
        let area = cv.contourArea(cnt);
        let rect = cv.boundingRect(cnt);
        let aspectRatio = rect.width / parseFloat(rect.height);

        if (area > (totalArea * 0.0005) && area < (totalArea * 0.03)) {
          if (aspectRatio >= 0.75 && aspectRatio <= 1.25) {
            let hull = new cv.Mat();
            cv.convexHull(cnt, hull);
            let solidity = area / (cv.contourArea(hull) || 1);
            hull.delete();

            if (solidity > 0.85) {
              cornerCandidates.push({
                x: rect.x + rect.width / 2,
                y: rect.y + rect.height / 2,
                area: area
              });
            }
          }
        }
      }

      let warped = new cv.Mat();
      const W = 800, H = 1000;

      if (cornerCandidates.length >= 4) {
        cornerCandidates.sort((a, b) => b.area - a.area);
        let top4 = cornerCandidates.slice(0, 4);

        let sums = top4.map(p => p.x + p.y);
        let diffs = top4.map(p => p.y - p.x);

        let topLeft = top4[sums.indexOf(Math.min(...sums))];
        let bottomRight = top4[sums.indexOf(Math.max(...sums))];
        let topRight = top4[diffs.indexOf(Math.min(...diffs))];
        let bottomLeft = top4[diffs.indexOf(Math.max(...diffs))];

        let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
          topLeft.x, topLeft.y,
          topRight.x, topRight.y,
          bottomRight.x, bottomRight.y,
          bottomLeft.x, bottomLeft.y
        ]);
        let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, W, 0, W, H, 0, H]);
        
        let M = cv.getPerspectiveTransform(srcTri, dstTri);
        cv.warpPerspective(thresh, warped, M, new cv.Size(W, H));
        
        srcTri.delete(); dstTri.delete(); M.delete();
      } else {
        cv.resize(thresh, warped, new cv.Size(W, H));
      }

      const labels = ['A', 'B', 'C', 'D', 'E'].slice(0, choicesCount);
      let detected = {};

      const startXRatio = 0.178;
      const startYRatio = 0.190;
      const rowStepRatio = 0.029;
      const colWidthRatio = 0.040;

      for (let i = 1; i <= totalItems; i++) {
        let colIdx = Math.floor((i - 1) / 20);
        let rowIdx = (i - 1) % 20;

        let centerY = Math.floor(H * (startYRatio + (rowIdx * rowStepRatio)));
        let itemX = Math.floor(W * (startXRatio + (colIdx * 0.38)));

        let fillDensities = [];

        // Sample internal area (70% radius) of each bubble in the row
        labels.forEach((_, idx) => {
          let centerX = Math.floor(itemX + (idx * W * colWidthRatio));
          let radius = Math.floor(W * 0.009); 

          let filledPixels = 0;
          let count = 0;

          for (let py = centerY - radius; py <= centerY + radius; py++) {
            for (let px = centerX - radius; px <= centerX + radius; px++) {
              if (px >= 0 && px < W && py >= 0 && py < H) {
                if (Math.hypot(px - centerX, py - centerY) <= radius) {
                  count++;
                  if (warped.ucharPtr(py, px)[0] > 0) filledPixels++;
                }
              }
            }
          }
          fillDensities.push(filledPixels / (count || 1));
        });

        // SHADING EVALUATION: Compare highest density vs remaining unshaded bubbles
        let maxVal = Math.max(...fillDensities);
        let maxIdx = fillDensities.indexOf(maxVal);

        let unshadedVals = fillDensities.filter((_, idx) => idx !== maxIdx);
        let minVal = Math.min(...unshadedVals);
        let avgUnshaded = unshadedVals.reduce((a, b) => a + b, 0) / unshadedVals.length;

        // Requires absolute fill >= 0.40 AND must be significantly darker than unshaded neighbors
        if (maxVal >= 0.40 && (maxVal - avgUnshaded) > 0.25 && (maxVal / (minVal || 0.01)) > 2.0) {
          detected[i] = labels[maxIdx];
        } else {
          detected[i] = 'N/A'; // Blank or unclear mark
        }
      }

      src.delete(); gray.delete(); blur.delete(); thresh.delete(); 
      contours.delete(); hierarchy.delete(); warped.delete();
      
      return detected;
    }

    function captureAndGrade() {
      if (!isOpenCvLoaded) {
        alert('OpenCV is initializing. Please retry in a few seconds.');
        return;
      }

      const section = document.getElementById('scan-section').value || 'Unassigned';
      const totalItems = Object.keys(answerKey).length;
      const choicesCount = parseInt(document.getElementById('gen-choices-count').value) || 4;

      const detected = runOMREngine('scan-canvas', totalItems, choicesCount);

      let correct = 0;
      for (let i = 1; i <= totalItems; i++) {
        if (detected[i] && detected[i] === answerKey[i]) correct++;
      }

      const scorePct = ((correct / totalItems) * 100).toFixed(1);
      const studentName = "Student " + Math.floor(1000 + Math.random() * 9000);

      records.push({
        id: Date.now(),
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        name: studentName,
        section: section,
        score: `${correct}/${totalItems}`,
        percentage: `${scorePct}%`
      });

      updateRecordsTable();
      closeCameraModal();
      alert(`Scanned: ${studentName}\nScore: ${correct}/${totalItems} (${scorePct}%)`);
    }

    function updateRecordsTable() {
      const tbody = document.getElementById('records-table-body');
      document.getElementById('record-count').innerText = records.length;
      tbody.innerHTML = '';

      records.forEach(rec => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-800/40 border-b border-slate-800">
            <td class="p-3 text-slate-400">${rec.timestamp}</td>
            <td class="p-3 font-medium text-white">${rec.name}</td>
            <td class="p-3 text-slate-300">${rec.section}</td>
            <td class="p-3 font-semibold text-indigo-300">${rec.score}</td>
            <td class="p-3 font-semibold text-emerald-400">${rec.percentage}</td>
            <td class="p-3 text-right">
              <button onclick="deleteRecord(${rec.id})" class="text-rose-400 hover:text-rose-300"><i class="fa-solid fa-trash-can"></i></button>
            </td>
          </tr>
        `;
      });
    }

    function deleteRecord(id) {
      records = records.filter(r => r.id !== id);
      updateRecordsTable();
    }

    async function syncToGoogleSheets() {
      if (!GAS_WEB_APP_URL || records.length === 0) return;
      try {
        await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(records)
        });
        alert('Data synced to Google Sheets.');
      } catch (err) {
        alert('Sync error: ' + err.message);
      }
    }
  </script>
</body>
</html>
