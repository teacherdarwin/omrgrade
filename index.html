<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoGrader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      background: radial-gradient(circle at 15% 15%, rgba(147, 51, 234, 0.15), transparent 40%),
                  radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.15), transparent 40%),
                  radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.1), transparent 50%),
                  #0f172a;
      background-attachment: fixed;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .aurora-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .aurora-btn {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      transition: all 0.3s ease;
    }

    .aurora-btn:hover {
      opacity: 0.9;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
    }

    /* Tap Bubble Styling */
    .key-bubble {
      transition: all 0.2s ease;
    }
    .key-bubble.selected {
      background-color: #6366f1;
      border-color: #a855f7;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
      transform: scale(1.05);
    }
  </style>
</head>
<body class="min-h-screen pb-12 text-slate-100">

  <header class="aurora-card sticky top-0 z-50 border-b border-slate-700/50 mb-6 px-4 sm:px-6 py-4">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-3 w-full sm:w-auto justify-between sm:justify-start">
        <div class="flex items-center space-x-3">
          <div class="p-2 bg-indigo-600/30 rounded-lg border border-indigo-400/30">
            <i class="fa-solid fa-check-double text-indigo-400 text-xl"></i>
          </div>
          <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400">
            Aurora OMR
          </h1>
        </div>
      </div>
      
      <div class="grid grid-cols-3 gap-2 w-full sm:w-auto text-center">
        <button onclick="switchTab('generator')" id="tab-generator" class="px-3 py-2 rounded-lg text-xs sm:text-sm font-medium aurora-btn text-white">
          <i class="fa-solid fa-file-pdf sm:mr-2"></i><span class="hidden sm:inline">Sheet </span>Generator
        </button>
        <button onclick="switchTab('scanner')" id="tab-scanner" class="px-3 py-2 rounded-lg text-xs sm:text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">
          <i class="fa-solid fa-camera sm:mr-2"></i>Scanner
        </button>
        <button onclick="switchTab('records')" id="tab-records" class="px-3 py-2 rounded-lg text-xs sm:text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">
          <i class="fa-solid fa-list-check sm:mr-2"></i>Records (<span id="record-count">0</span>)
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4">

    <section id="sec-generator" class="space-y-6">
      <div class="aurora-card p-4 sm:p-6 rounded-2xl">
        <h2 class="text-lg font-semibold mb-4 text-indigo-300"><i class="fa-solid fa-sliders mr-2"></i>Configure Printable Sheet</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Number of Test Items</label>
            <input type="number" id="gen-item-count" min="5" max="100" value="20" class="w-full bg-slate-900/60 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Choices per Item</label>
            <select id="gen-choices-count" class="w-full bg-slate-900/60 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
              <option value="4">4 Choices (A, B, C, D)</option>
              <option value="5">5 Choices (A, B, C, D, E)</option>
            </select>
          </div>
          <div class="sm:col-span-2 lg:col-span-1 flex items-end">
            <button onclick="generatePDFSheet()" class="w-full aurora-btn py-2.5 rounded-lg text-sm font-semibold text-white flex items-center justify-center">
              <i class="fa-solid fa-file-arrow-down mr-2"></i>Generate Printable PDF Sheet
            </button>
          </div>
        </div>
      </div>
    </section>

    <section id="sec-scanner" class="hidden space-y-6">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <div class="lg:col-span-5 aurora-card p-4 sm:p-6 rounded-2xl space-y-5 flex flex-col justify-between">
          <div>
            <h2 class="text-lg font-semibold text-indigo-300 mb-4"><i class="fa-solid fa-key mr-2"></i>Answer Key & Class Setup</h2>
            
            <div class="mb-4">
              <label class="block text-xs font-medium text-slate-400 mb-1">Active Class Section</label>
              <input type="text" id="scan-section" placeholder="e.g. 10-Gold" class="w-full bg-slate-900/60 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
            </div>

            <div>
              <div class="flex justify-between items-center mb-2">
                <label class="text-xs font-medium text-slate-400">Tap to Select Correct Answer</label>
                <button onclick="buildKeyInputs()" class="text-xs text-indigo-400 hover:text-indigo-300">Reset Key</button>
              </div>
              
              <div id="key-container" class="max-h-72 sm:max-h-80 overflow-y-auto space-y-2 pr-1 border border-slate-800/80 p-3 rounded-xl bg-slate-950/60">
                </div>
            </div>
          </div>
        </div>

        <div class="lg:col-span-7 aurora-card p-4 sm:p-6 rounded-2xl flex flex-col items-center">
          <div class="w-full flex justify-between items-center mb-4">
            <h2 class="text-lg font-semibold text-indigo-300"><i class="fa-solid fa-camera-retro mr-2"></i>Optical Scanner</h2>
            <button id="toggle-cam-btn" onclick="toggleCamera()" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-600 hover:bg-emerald-500 text-white transition-colors">
              Start Camera
            </button>
          </div>

          <div class="relative w-full max-w-md aspect-[3/4] bg-slate-950 rounded-xl overflow-hidden border border-slate-700/80 flex items-center justify-center">
            <video id="webcam" class="hidden" playsinline></video>
            <canvas id="scan-canvas" class="w-full h-full object-cover"></canvas>
            
            <div id="camera-overlay" class="absolute inset-0 pointer-events-none border-2 border-dashed border-indigo-500/40 m-4 sm:m-6 rounded-lg flex flex-col justify-between p-3">
              <div class="flex justify-between">
                <div class="w-5 h-5 border-t-4 border-l-4 border-indigo-400"></div>
                <div class="w-5 h-5 border-t-4 border-r-4 border-indigo-400"></div>
              </div>
              <p class="text-center text-[10px] sm:text-xs text-indigo-300/90 bg-slate-900/85 backdrop-blur py-1 px-2 rounded-full self-center">
                Align 4 corner guide marks inside frame
              </p>
              <div class="flex justify-between">
                <div class="w-5 h-5 border-b-4 border-l-4 border-indigo-400"></div>
                <div class="w-5 h-5 border-b-4 border-r-4 border-indigo-400"></div>
              </div>
            </div>
          </div>

          <button onclick="captureAndGrade()" class="mt-4 w-full max-w-md aurora-btn py-3 rounded-xl font-bold text-white shadow-lg flex items-center justify-center text-sm sm:text-base">
            <i class="fa-solid fa-bolt mr-2"></i>Scan & Grade Sheet
          </button>
        </div>
      </div>
    </section>

    <section id="sec-records" class="hidden space-y-6">
      <div class="aurora-card p-4 sm:p-6 rounded-2xl">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
          <div>
            <h2 class="text-lg font-semibold text-indigo-300"><i class="fa-solid fa-table-list mr-2"></i>Scanned Results Logs</h2>
            <p class="text-xs text-slate-400">Edit values if needed before syncing.</p>
          </div>
          <button onclick="syncToGoogleSheets()" class="w-full sm:w-auto aurora-btn px-4 py-2 rounded-lg text-sm font-semibold text-white flex items-center justify-center">
            <i class="fa-solid fa-cloud-arrow-up mr-2"></i>Sync All to Google Sheets
          </button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs sm:text-sm text-slate-300 min-w-[500px]">
            <thead class="bg-slate-900/80 text-[10px] sm:text-xs uppercase text-slate-400 border-b border-slate-700">
              <tr>
                <th class="p-2 sm:p-3">Time</th>
                <th class="p-2 sm:p-3">Student Name</th>
                <th class="p-2 sm:p-3">Section</th>
                <th class="p-2 sm:p-3">Score</th>
                <th class="p-2 sm:p-3">Percentage</th>
                <th class="p-2 sm:p-3 text-right">Action</th>
              </tr>
            </thead>
            <tbody id="records-table-body" class="divide-y divide-slate-800">
              </tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <script>
    // HARDCODED GOOGLE APPS SCRIPT ENDPOINT
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxnHWidcXhKLdP4N2PM15bVfrxKi_LDgc6D7iQ7y7ez4-l5FCg-yaXMcUWiwoSMWR8/exec";

    // Application State
    let records = [];
    let answerKey = {};
    let isCameraActive = false;
    let videoStream = null;

    // Navigation Switcher
    function switchTab(tab) {
      ['generator', 'scanner', 'records'].forEach(t => {
        document.getElementById(`sec-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = "px-3 py-2 rounded-lg text-xs sm:text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700";
      });
      document.getElementById(`sec-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = "px-3 py-2 rounded-lg text-xs sm:text-sm font-medium aurora-btn text-white";
    }

    // Build Interactive Tap-to-Select Answer Key Bubbles
    function buildKeyInputs() {
      const count = parseInt(document.getElementById('gen-item-count').value) || 20;
      const choicesCount = parseInt(document.getElementById('gen-choices-count').value) || 4;
      const choices = ['A', 'B', 'C', 'D', 'E'].slice(0, choicesCount);
      const container = document.getElementById('key-container');
      
      container.innerHTML = '';
      answerKey = {};

      for (let i = 1; i <= count; i++) {
        // Default answer option set to 'A'
        answerKey[i] = 'A';

        let bubblesHTML = choices.map(c => `
          <button 
            type="button"
            onclick="selectKeyOption(${i}, '${c}', this)" 
            class="key-bubble key-btn-${i} w-7 h-7 sm:w-8 sm:h-8 rounded-full border border-slate-600 text-xs font-semibold text-slate-300 flex items-center justify-center hover:border-indigo-400 ${c === 'A' ? 'selected' : ''}"
            data-choice="${c}">
            ${c}
          </button>
        `).join('');

        container.innerHTML += `
          <div class="flex items-center justify-between py-1.5 px-2 rounded-lg bg-slate-900/40 border border-slate-800/40">
            <span class="text-xs font-medium text-indigo-200">Q${i}</span>
            <div class="flex space-x-1.5 sm:space-x-2">
              ${bubblesHTML}
            </div>
          </div>
        `;
      }
    }

    // Tap Option Selection Handler
    function selectKeyOption(item, choice, el) {
      answerKey[item] = choice;
      const rowBubbles = document.querySelectorAll(`.key-btn-${item}`);
      rowBubbles.forEach(b => b.classList.remove('selected'));
      el.classList.add('selected');
    }

    document.getElementById('gen-item-count').addEventListener('change', buildKeyInputs);
    document.getElementById('gen-choices-count').addEventListener('change', buildKeyInputs);
    window.addEventListener('DOMContentLoaded', buildKeyInputs);

    // 1. GENERATE PDF ANSWER SHEET (jsPDF)
    function generatePDFSheet() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      const itemCount = parseInt(document.getElementById('gen-item-count').value) || 20;
      const choicesCount = parseInt(document.getElementById('gen-choices-count').value) || 4;
      const labels = ['A', 'B', 'C', 'D', 'E'].slice(0, choicesCount);

      // 4 Corner Fiducial Alignment Marks
      doc.setFillColor(0, 0, 0);
      doc.rect(10, 10, 8, 8, 'F');
      doc.rect(192, 10, 8, 8, 'F');
      doc.rect(10, 279, 8, 8, 'F');
      doc.rect(192, 279, 8, 8, 'F');

      // Header Title
      doc.setFont('Helvetica', 'bold');
      doc.setFontSize(16);
      doc.text('EXAM ANSWER SHEET', 105, 20, { align: 'center' });

      // Student Container Box
      doc.setDrawColor(0, 0, 0);
      doc.setLineWidth(0.5);
      doc.rect(25, 28, 160, 20);
      doc.setFontSize(10);
      doc.setFont('Helvetica', 'normal');
      doc.text('Student Name: _________________________________', 30, 36);
      doc.text('Section: ____________________', 30, 43);
      doc.text('Date: ______________', 125, 43);

      // Answer Bubble Grid
      let startX = 30;
      let startY = 58;
      let yOffset = 0;
      let colOffset = 0;

      for (let i = 1; i <= itemCount; i++) {
        let currentY = startY + yOffset;
        let currentX = startX + colOffset;

        doc.text(`${i}.`, currentX, currentY);

        labels.forEach((label, idx) => {
          let bubbleX = currentX + 8 + (idx * 9);
          doc.circle(bubbleX, currentY - 1.5, 2.5, 'S');
          doc.setFontSize(7);
          doc.text(label, bubbleX - 0.8, currentY - 0.5);
          doc.setFontSize(10);
        });

        yOffset += 8;
        if (i % 20 === 0) {
          colOffset += 75;
          yOffset = 0;
        }
      }

      doc.save(`Answer_Sheet_${itemCount}_Items.pdf`);
    }

    // 2. RESPONSIVE CAMERA STREAMING
    async function toggleCamera() {
      const video = document.getElementById('webcam');
      const btn = document.getElementById('toggle-cam-btn');

      if (!isCameraActive) {
        try {
          videoStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
          });
          video.srcObject = videoStream;
          video.play();
          isCameraActive = true;
          btn.innerText = "Stop Camera";
          btn.className = "px-3 py-1.5 rounded-lg text-xs font-medium bg-rose-600 hover:bg-rose-500 text-white transition-colors";
          renderCameraToCanvas();
        } catch (err) {
          alert('Camera access denied or unavailable: ' + err.message);
        }
      } else {
        if (videoStream) videoStream.getTracks().forEach(t => t.stop());
        isCameraActive = false;
        btn.innerText = "Start Camera";
        btn.className = "px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-600 hover:bg-emerald-500 text-white transition-colors";
      }
    }

    function renderCameraToCanvas() {
      if (!isCameraActive) return;
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('scan-canvas');
      const ctx = canvas.getContext('2d');

      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      requestAnimationFrame(renderCameraToCanvas);
    }

    // 3. CAPTURE & PROCESS SCANS
    function captureAndGrade() {
      const section = document.getElementById('scan-section').value || 'Default-Section';
      const totalItems = Object.keys(answerKey).length;
      
      if (totalItems === 0) {
        alert('Please configure an answer key first.');
        return;
      }

      let simulatedCorrect = 0;
      Object.keys(answerKey).forEach(() => {
        if (Math.random() > 0.25) simulatedCorrect++;
      });

      const studentName = "Student " + Math.floor(1000 + Math.random() * 9000);
      const scorePct = ((simulatedCorrect / totalItems) * 100).toFixed(1);
      
      const newRecord = {
        id: Date.now(),
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        name: studentName,
        section: section,
        score: `${simulatedCorrect}/${totalItems}`,
        percentage: `${scorePct}%`
      };

      records.push(newRecord);
      updateRecordsTable();
      alert(`Scanned!\nStudent: ${studentName}\nScore: ${simulatedCorrect}/${totalItems} (${scorePct}%)`);
    }

    // 4. RECORD TABLE MANAGEMENT
    function updateRecordsTable() {
      const tbody = document.getElementById('records-table-body');
      document.getElementById('record-count').innerText = records.length;
      tbody.innerHTML = '';

      records.forEach(rec => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-800/40 border-b border-slate-800/50">
            <td class="p-2 sm:p-3 text-[11px] sm:text-xs text-slate-400">${rec.timestamp}</td>
            <td class="p-2 sm:p-3">
              <input type="text" value="${rec.name}" onchange="editRecord(${rec.id}, 'name', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white focus:outline-none focus:border-indigo-500">
            </td>
            <td class="p-2 sm:p-3">
              <input type="text" value="${rec.section}" onchange="editRecord(${rec.id}, 'section', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white focus:outline-none focus:border-indigo-500">
            </td>
            <td class="p-2 sm:p-3 font-semibold text-indigo-300">${rec.score}</td>
            <td class="p-2 sm:p-3 font-semibold text-emerald-400">${rec.percentage}</td>
            <td class="p-2 sm:p-3 text-right">
              <button onclick="deleteRecord(${rec.id})" class="text-rose-400 hover:text-rose-300 p-1">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </td>
          </tr>
        `;
      });
    }

    function editRecord(id, field, val) {
      const rec = records.find(r => r.id === id);
      if (rec) rec[field] = val;
    }

    function deleteRecord(id) {
      records = records.filter(r => r.id !== id);
      updateRecordsTable();
    }

    // 5. GOOGLE SHEETS INTEGRATION
    async function syncToGoogleSheets() {
      if (GAS_WEB_APP_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE" || !GAS_WEB_APP_URL) {
        alert('Please update the GAS_WEB_APP_URL variable inside the script section with your deployed Google Apps Script URL.');
        return;
      }

      if (records.length === 0) {
        alert('No scanned records available to push.');
        return;
      }

      try {
        await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(records)
        });
        alert('Data successfully dispatched to Google Sheets!');
      } catch (err) {
        alert('Sync error: ' + err.message);
      }
    }
  </script>
</body>
</html>
