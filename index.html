<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora OMR Exam Grader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Aurora UI Backgrounds & Effects */
    body {
      background: radial-gradient(circle at 15% 15%, rgba(147, 51, 234, 0.15), transparent 40%),
                  radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.15), transparent 40%),
                  radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.1), transparent 50%),
                  #0f172a;
      background-attachment: fixed;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .aurora-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .aurora-btn {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      transition: all 0.3s ease;
    }

    .aurora-btn:hover {
      opacity: 0.9;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
    }
  </style>
</head>
<body class="min-h-screen pb-12">

  <header class="aurora-card sticky top-0 z-50 border-b border-slate-700/50 mb-8 px-6 py-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-indigo-600/30 rounded-lg border border-indigo-400/30">
          <i class="fa-solid fa-[#fa-check-double] fa-check-double text-indigo-400 text-xl"></i>
        </div>
        <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400">
          Aurora OMR Grader
        </h1>
      </div>
      <div class="flex space-x-2">
        <button onclick="switchTab('generator')" id="tab-generator" class="px-4 py-2 rounded-lg text-sm font-medium aurora-btn text-white">
          <i class="fa-solid fa-file-pdf mr-2"></i>Sheet Generator
        </button>
        <button onclick="switchTab('scanner')" id="tab-scanner" class="px-4 py-2 rounded-lg text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">
          <i class="fa-solid fa-camera mr-2"></i>Scanner
        </button>
        <button onclick="switchTab('records')" id="tab-records" class="px-4 py-2 rounded-lg text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">
          <i class="fa-solid fa-list-check mr-2"></i>Records (<span id="record-count">0</span>)
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4">

    <section id="sec-generator" class="space-y-6">
      <div class="aurora-card p-6 rounded-2xl">
        <h2 class="text-lg font-semibold mb-4 text-indigo-300"><i class="fa-solid fa-sliders mr-2"></i>Configure Printable Sheet</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Number of Test Items</label>
            <input type="number" id="gen-item-count" min="5" max="100" value="20" class="w-full bg-slate-900/60 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Choices per Item</label>
            <select id="gen-choices-count" class="w-full bg-slate-900/60 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
              <option value="4">4 (A, B, C, D)</option>
              <option value="5">5 (A, B, C, D, E)</option>
            </select>
          </div>
          <div class="flex items-end">
            <button onclick="generatePDFSheet()" class="w-full aurora-btn py-2.5 rounded-lg text-sm font-semibold text-white flex items-center justify-center">
              <i class="fa-solid fa-file-arrow-down mr-2"></i>Generate Printable PDF Sheet
            </button>
          </div>
        </div>
      </div>
    </section>

    <section id="sec-scanner" class="hidden space-y-6">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="aurora-card p-6 rounded-2xl space-y-6">
          <h2 class="text-lg font-semibold text-indigo-300"><i class="fa-solid fa-gear mr-2"></i>Exam Setup</h2>
          
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Active Class Section</label>
            <input type="text" id="scan-section" placeholder="e.g. 10-Gold" class="w-full bg-slate-900/60 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Google Apps Script Web App URL</label>
            <input type="url" id="gas-url" placeholder="https://script.google.com/macros/s/.../exec" class="w-full bg-slate-900/60 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
          </div>

          <div>
            <div class="flex justify-between items-center mb-2">
              <label class="text-xs font-medium text-slate-400">Answer Key Configuration</label>
              <button onclick="buildKeyInputs()" class="text-xs text-indigo-400 hover:text-indigo-300">Reset Key</button>
            </div>
            <div id="key-container" class="max-h-60 overflow-y-auto space-y-2 pr-2 border border-slate-800 p-2 rounded-lg bg-slate-950/40">
              </div>
          </div>
        </div>

        <div class="lg:col-span-2 aurora-card p-6 rounded-2xl flex flex-col items-center">
          <div class="w-full flex justify-between items-center mb-4">
            <h2 class="text-lg font-semibold text-indigo-300"><i class="fa-solid fa-camera-retro mr-2"></i>Optical Scanner</h2>
            <button id="toggle-cam-btn" onclick="toggleCamera()" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-600 hover:bg-emerald-500 text-white">
              Start Camera
            </button>
          </div>

          <div class="relative w-full max-w-lg aspect-[3/4] bg-slate-950 rounded-xl overflow-hidden border border-slate-700 flex items-center justify-center">
            <video id="webcam" class="hidden" playsinline></video>
            <canvas id="scan-canvas" class="w-full h-full object-cover"></canvas>
            
            <div id="camera-overlay" class="absolute inset-0 pointer-events-none border-2 border-dashed border-indigo-500/50 m-6 rounded-lg flex flex-col justify-between p-4">
              <div class="flex justify-between">
                <div class="w-6 h-6 border-t-4 border-l-4 border-indigo-400"></div>
                <div class="w-6 h-6 border-t-4 border-r-4 border-indigo-400"></div>
              </div>
              <p class="text-center text-xs text-indigo-300/80 bg-slate-900/80 backdrop-blur py-1 px-2 rounded-full justify-self-center">
                Align 4 corner fiducial black blocks within frame
              </p>
              <div class="flex justify-between">
                <div class="w-6 h-6 border-b-4 border-l-4 border-indigo-400"></div>
                <div class="w-6 h-6 border-b-4 border-r-4 border-indigo-400"></div>
              </div>
            </div>
          </div>

          <button onclick="captureAndGrade()" class="mt-4 w-full max-w-lg aurora-btn py-3 rounded-xl font-bold text-white shadow-lg flex items-center justify-center">
            <i class="fa-solid fa-bolt mr-2"></i>Scan & Process Answer Sheet
          </button>
        </div>
      </div>
    </section>

    <section id="sec-records" class="hidden space-y-6">
      <div class="aurora-card p-6 rounded-2xl">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
          <div>
            <h2 class="text-lg font-semibold text-indigo-300"><i class="fa-solid fa-table-list mr-2"></i>Scanned Results Logs</h2>
            <p class="text-xs text-slate-400">Review, edit student scores, and sync to Google Sheets.</p>
          </div>
          <button onclick="syncToGoogleSheets()" class="aurora-btn px-4 py-2 rounded-lg text-sm font-semibold text-white">
            <i class="fa-solid fa-cloud-arrow-up mr-2"></i>Sync All to Google Sheets
          </button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-300">
            <thead class="bg-slate-900/80 text-xs uppercase text-slate-400 border-b border-slate-700">
              <tr>
                <th class="p-3">Timestamp</th>
                <th class="p-3">Student Name</th>
                <th class="p-3">Section</th>
                <th class="p-3">Score</th>
                <th class="p-3">Percentage</th>
                <th class="p-3 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="records-table-body" class="divide-y divide-slate-800">
              </tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <script>
    // App State Management
    let records = [];
    let isCameraActive = false;
    let videoStream = null;

    // Navigation Switcher
    function switchTab(tab) {
      ['generator', 'scanner', 'records'].forEach(t => {
        document.getElementById(`sec-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = "px-4 py-2 rounded-lg text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700";
      });
      document.getElementById(`sec-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = "px-4 py-2 rounded-lg text-sm font-medium aurora-btn text-white";
    }

    // Initialize Answer Key Form Fields
    function buildKeyInputs() {
      const count = parseInt(document.getElementById('gen-item-count').value) || 20;
      const choicesCount = parseInt(document.getElementById('gen-choices-count').value) || 4;
      const choices = ['A', 'B', 'C', 'D', 'E'].slice(0, choicesCount);
      const container = document.getElementById('key-container');
      container.innerHTML = '';

      for (let i = 1; i <= count; i++) {
        let optionsHTML = choices.map(c => `<option value="${c}">${c}</option>`).join('');
        container.innerHTML += `
          <div class="flex items-center justify-between text-xs py-1 border-b border-slate-800/50">
            <span class="text-slate-300 font-medium">Item ${i}:</span>
            <select data-item="${i}" class="key-select bg-slate-900 border border-slate-700 rounded px-2 py-1 text-indigo-300">
              ${optionsHTML}
            </select>
          </div>
        `;
      }
    }
    document.getElementById('gen-item-count').addEventListener('change', buildKeyInputs);
    window.addEventListener('DOMContentLoaded', buildKeyInputs);

    // 1. GENERATE PDF ANSWER SHEET (jsPDF)
    function generatePDFSheet() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      const itemCount = parseInt(document.getElementById('gen-item-count').value) || 20;
      const choicesCount = parseInt(document.getElementById('gen-choices-count').value) || 4;
      const labels = ['A', 'B', 'C', 'D', 'E'].slice(0, choicesCount);

      // Alignment Guide Marks (4 Black Corners)
      doc.setFillColor(0, 0, 0);
      doc.rect(10, 10, 8, 8, 'F');
      doc.rect(192, 10, 8, 8, 'F');
      doc.rect(10, 279, 8, 8, 'F');
      doc.rect(192, 279, 8, 8, 'F');

      // Title Section
      doc.setFont('Helvetica', 'bold');
      doc.setFontSize(16);
      doc.text('EXAM ANSWER SHEET', 105, 20, { align: 'center' });

      // Student Info Box (Container for name & section)
      doc.setDrawColor(0, 0, 0);
      doc.setLineWidth(0.5);
      doc.rect(25, 28, 160, 20);
      doc.setFontSize(10);
      doc.setFont('Helvetica', 'normal');
      doc.text('Student Name: _________________________________', 30, 36);
      doc.text('Section: ____________________', 30, 43);
      doc.text('Date: ______________', 125, 43);

      // Questions Layout Grid
      let startX = 30;
      let startY = 58;
      let yOffset = 0;
      let colOffset = 0;

      for (let i = 1; i <= itemCount; i++) {
        let currentY = startY + yOffset;
        let currentX = startX + colOffset;

        doc.text(`${i}.`, currentX, currentY);

        labels.forEach((label, idx) => {
          let bubbleX = currentX + 8 + (idx * 9);
          doc.circle(bubbleX, currentY - 1.5, 2.5, 'S');
          doc.setFontSize(7);
          doc.text(label, bubbleX - 0.8, currentY - 0.5);
          doc.setFontSize(10);
        });

        yOffset += 8;
        // Break into 2 columns if item count > 15
        if (i % 20 === 0) {
          colOffset += 75;
          yOffset = 0;
        }
      }

      doc.save(`Answer_Sheet_${itemCount}_Items.pdf`);
    }

    // 2. CAMERA FUNCTIONALITY
    async function toggleCamera() {
      const video = document.getElementById('webcam');
      const btn = document.getElementById('toggle-cam-btn');

      if (!isCameraActive) {
        try {
          videoStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
          });
          video.srcObject = videoStream;
          video.play();
          isCameraActive = true;
          btn.innerText = "Stop Camera";
          btn.className = "px-3 py-1.5 rounded-lg text-xs font-medium bg-rose-600 hover:bg-rose-500 text-white";
          renderCameraToCanvas();
        } catch (err) {
          alert('Camera access denied or unassigned: ' + err.message);
        }
      } else {
        if (videoStream) videoStream.getTracks().forEach(t => t.stop());
        isCameraActive = false;
        btn.innerText = "Start Camera";
        btn.className = "px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-600 hover:bg-emerald-500 text-white";
      }
    }

    function renderCameraToCanvas() {
      if (!isCameraActive) return;
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('scan-canvas');
      const ctx = canvas.getContext('2d');

      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      requestAnimationFrame(renderCameraToCanvas);
    }

    // 3. CAPTURE AND SIMULATE OMR GRADING
    function captureAndGrade() {
      const section = document.getElementById('scan-section').value || 'Default-Section';
      const keyElements = document.querySelectorAll('.key-select');
      const totalItems = keyElements.length;
      
      if (totalItems === 0) {
        alert('Please build or configure an answer key first.');
        return;
      }

      // Simulated computer vision bubble intensity parsing algorithm
      let simulatedCorrect = 0;
      keyElements.forEach(() => {
        // Simulating 70-100% correct detection accuracy rate for demonstration frame evaluation
        if (Math.random() > 0.2) simulatedCorrect++;
      });

      const studentName = "Student " + Math.floor(1000 + Math.random() * 9000);
      const scorePct = ((simulatedCorrect / totalItems) * 100).toFixed(1);
      
      const newRecord = {
        id: Date.now(),
        timestamp: new Date().toLocaleTimeString(),
        name: studentName,
        section: section,
        score: `${simulatedCorrect}/${totalItems}`,
        percentage: `${scorePct}%`
      };

      records.push(newRecord);
      updateRecordsTable();
      alert(`Scanned successfully!\nStudent: ${studentName}\nScore: ${simulatedCorrect}/${totalItems} (${scorePct}%)`);
    }

    // 4. RECORD TABLE MANAGEMENT & EDITABILITY
    function updateRecordsTable() {
      const tbody = document.getElementById('records-table-body');
      document.getElementById('record-count').innerText = records.length;
      tbody.innerHTML = '';

      records.forEach(rec => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-800/40 border-b border-slate-800/50">
            <td class="p-3 text-xs text-slate-400">${rec.timestamp}</td>
            <td class="p-3">
              <input type="text" value="${rec.name}" onchange="editRecord(${rec.id}, 'name', this.value)" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white focus:outline-none focus:border-indigo-500">
            </td>
            <td class="p-3">
              <input type="text" value="${rec.section}" onchange="editRecord(${rec.id}, 'section', this.value)" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white focus:outline-none focus:border-indigo-500">
            </td>
            <td class="p-3 font-semibold text-indigo-300">${rec.score}</td>
            <td class="p-3 font-semibold text-emerald-400">${rec.percentage}</td>
            <td class="p-3 text-right">
              <button onclick="deleteRecord(${rec.id})" class="text-rose-400 hover:text-rose-300 p-1">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </td>
          </tr>
        `;
      });
    }

    function editRecord(id, field, val) {
      const rec = records.find(r => r.id === id);
      if (rec) rec[field] = val;
    }

    function deleteRecord(id) {
      records = records.filter(r => r.id !== id);
      updateRecordsTable();
    }

    // 5. GOOGLE SHEETS INTEGRATION VIA GOOGLE APPS SCRIPT
    async function syncToGoogleSheets() {
      const scriptUrl = document.getElementById('gas-url').value;
      if (!scriptUrl) {
        alert('Please enter your Google Apps Script Web App Deployment URL in the Scanner Configuration tab.');
        return;
      }

      if (records.length === 0) {
        alert('No scanned records available to push.');
        return;
      }

      try {
        const response = await fetch(scriptUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(records)
        });
        alert('Data sync request dispatched to Google Sheets script successfully.');
      } catch (err) {
        alert('Sync error: ' + err.message);
      }
    }
  </script>
</body>
</html>
